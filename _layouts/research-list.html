---
layout: compress
---
<!DOCTYPE html>
<!--[if lt IE 7]><html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if (IE 7)&!(IEMobile)]><html class="no-js lt-ie9 lt-ie8"><![endif]-->
<!--[if (IE 8)&!(IEMobile)]><html class="no-js lt-ie9"><![endif]-->
<!--[if gt IE 8]><!--> <html class="no-js"><!--<![endif]-->
<head>
    {% include head.html %}
</head>
<body>
    {% include nav.html %}
    <!-- Header -->
    <header class="header" role="banner">
        <div class="wrapper animated fadeIn">
            <div class="content">
                <div class="post-title">
                    <h1>{{ page.title }}</h1>
                    <a class="btn zoombtn" href="{{site.url}}">
                        <i class="fa fa-home"></i>
                    </a>
                </div>
                <div class="post-list">
                    {% for research in site.research %}
                    <ul>
                       <li class="wow fadeInLeft" data-wow-duration="1.5s" style="display: flex; align-items: center;">
                          <!-- Image (Side-by-Side) -->
                          {% if research.image %}
                             <div class="research-image-container" style="flex-shrink: 0; margin-right: 20px;">
                                <img src="{{ site.url }}{{ research.image }}" alt="{{ research.title }}" class="research-image" style="width: 150px; height: auto;"/>
                             </div>
                          {% endif %}
                          <!-- Post Content -->
                          <div class="research-content">
                             <a class="zoombtn" href="{{ site.url }}{{ research.url }}">{{ research.title }}</a>
                             <p>{{ research.excerpt }}</p>
                             <a href="{{ site.url }}{{ research.url }}" class="btn zoombtn">Read More</a>
                          </div>
                       </li>
                    </ul>
                 {% endfor %}
                </div>
            </div>
        </div>
    </header>
    {% include scripts.html %}
    <script src="{{ site.url }}/assets/js/wow.min.js"></script>
    <script type="text/javascript">(new WOW).init();</script>
</body>
</html>
